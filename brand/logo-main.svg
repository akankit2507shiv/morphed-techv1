<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- MORPHED TECH - Main Logo (Dark Background Version) -->
  <!-- M Symbol with abstract Trishul-inspired center stroke -->
  <defs>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5D76E"/>
    </linearGradient>
    <linearGradient id="indigoBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  
  <!-- M Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer M shape - geometric, clean -->
    <path d="M8 72 L8 16 L28 16 L40 38 L52 16 L72 16 L72 72" 
          stroke="url(#goldAccent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Center Trishul-inspired stroke: abstract trident peak -->
    <path d="M40 38 L40 72" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round"/>
    <!-- Subtle trishul prongs (abstract, elegant) -->
    <path d="M33 44 L40 34 L47 44" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Small diamond accent at trishul tip -->
    <path d="M40 28 L43 32 L40 36 L37 32 Z" fill="url(#goldAccent)" opacity="0.8"/>
  </g>
  
  <!-- Wordmark: MORPHED TECH -->
  <text x="100" y="58" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="2" fill="white">MORPHED</text>
  <text x="310" y="58" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="300" letter-spacing="2" fill="url(#goldAccent)">TECH</text>
  
  <!-- Subtle tagline -->
  <text x="100" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" letter-spacing="4" fill="#94A3B8" opacity="0.7">DATA ENGINEERING MASTERY</text>
</svg>
