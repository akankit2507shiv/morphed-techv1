<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- MORPHED TECH - Icon Only Version -->
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5D76E"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="80" height="80" rx="18" fill="url(#iconBg)"/>
  
  <!-- M with Trishul center -->
  <g transform="translate(12, 14)">
    <!-- M outer strokes -->
    <path d="M6 54 L6 12 L22 12 L28 28 L34 12 L50 12 L50 54" 
          stroke="url(#iconGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Center vertical (trishul shaft) -->
    <path d="M28 28 L28 54" stroke="url(#iconGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Abstract trishul prongs -->
    <path d="M22 33 L28 24 L34 33" stroke="url(#iconGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Diamond tip -->
    <path d="M28 18 L30.5 22 L28 26 L25.5 22 Z" fill="url(#iconGold)" opacity="0.85"/>
  </g>
</svg>
