services:
  - type: web
    name: morphed-tech-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: morphed-tech-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: YOUR_ADMIN_EMAIL
      - key: ADMIN_PASSWORD
        value: YOUR_ADMIN_PASSWORD
      - key: UPI_ID
        value: YOUR_UPI_ID
      - key: UPI_NAME
        value: Morphed Tech
      - key: COURSE_PRICE
        value: 7777
      - key: TELEGRAM_BOT_TOKEN
        value: YOUR_TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        value: YOUR_TELEGRAM_CHAT_ID
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://morphedtechai.com
