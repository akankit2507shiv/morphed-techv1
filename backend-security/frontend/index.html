<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphed Tech - Secure Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      padding: 40px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
    }
    button {
      background: linear-gradient(135deg, #7C3AED, #06B6D4);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      transform: scale(1.05);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
    }
    .video-container {
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    video {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>🔱 Morphed Tech - Secure Platform</h1>
      <p>Content Protection Demo</p>
    </div>

    <!-- Login Section -->
    <div class="card" id="loginSection">
      <h2>🔐 OTP Login</h2>
      <input type="email" id="emailInput" placeholder="Enter your email">
      <button onclick="requestOTP()">Send OTP</button>
      
      <div id="otpSection" style="display: none; margin-top: 20px;">
        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6">
        <button onclick="verifyOTP()">Verify & Login</button>
      </div>
    </div>

    <!-- Protected Content Section -->
    <div class="card" id="contentSection" style="display: none;">
      <h2>📚 Protected Content</h2>
      <p>Welcome, <span id="userName"></span>!</p>
      <p>Email: <span id="userEmail"></span></p>
      
      <button onclick="loadVideo()">Load Video</button>
      <button onclick="logout()">Logout</button>
      
      <div class="video-container" id="videoContainer" style="display: none;">
        <video id="protectedVideo" controls></video>
      </div>
    </div>

    <!-- Status Messages -->
    <div class="card" id="statusCard" style="display: none;">
      <p id="statusMessage"></p>
    </div>
  </div>

  <!-- Include Content Protection Script -->
  <script src="contentProtection.js"></script>

  <script>
    const API_URL = 'https://kaal-morphed-tech.onrender.com/api';

    // =====================================================
    // 1. REQUEST OTP
    // =====================================================
    async function requestOTP() {
      const email = document.getElementById('emailInput').value;
      
      if (!email || !email.includes('@')) {
        showStatus('Please enter a valid email', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/auth/request-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          showStatus('OTP sent to your email! Check your inbox.', 'success');
          document.getElementById('otpSection').style.display = 'block';
        } else {
          showStatus(data.error || 'Failed to send OTP', 'error');
        }
      } catch (error) {
        showStatus('Network error. Please try again.', 'error');
      }
    }

    // =====================================================
    // 2. VERIFY OTP & LOGIN
    // =====================================================
    async function verifyOTP() {
      const email = document.getElementById('emailInput').value;
      const otp = document.getElementById('otpInput').value;

      if (!otp || otp.length !== 6) {
        showStatus('Please enter a valid 6-digit OTP', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, otp })
        });

        const data = await response.json();

        if (data.success) {
          // Store token and user info
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          showStatus('Login successful!', 'success');
          
          // Show protected content
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('contentSection').style.display = 'block';
          document.getElementById('userName').textContent = data.user.name;
          document.getElementById('userEmail').textContent = data.user.email;

          // Initialize content protection
          window.contentProtection = new ContentProtection(data.user.email);
        } else {
          showStatus(data.error || 'Invalid OTP', 'error');
        }
      } catch (error) {
        showStatus('Login failed. Please try again.', 'error');
      }
    }

    // =====================================================
    // 3. LOAD PROTECTED VIDEO
    // =====================================================
    async function loadVideo() {
      const videoId = 'sample-video-001'; // Replace with actual video ID

      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_URL}/video/get-video-url`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include',
          body: JSON.stringify({ videoId })
        });

        const data = await response.json();

        if (data.success) {
          const videoElement = document.getElementById('protectedVideo');
          videoElement.src = data.videoUrl;
          document.getElementById('videoContainer').style.display = 'block';
          
          showStatus(`Video loaded! Expires in ${Math.floor(data.expiresIn / 60)} minutes`, 'success');

          // Log video access
          await fetch(`${API_URL}/video/log-video-access`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            credentials: 'include',
            body: JSON.stringify({ videoId })
          });
        } else {
          showStatus(data.error || 'Failed to load video', 'error');
        }
      } catch (error) {
        showStatus('Failed to load video. Please try again.', 'error');
      }
    }

    // =====================================================
    // 4. LOGOUT
    // =====================================================
    async function logout() {
      try {
        const token = localStorage.getItem('token');
        await fetch(`${API_URL}/auth/logout`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });

        localStorage.removeItem('token');
        localStorage.removeItem('user');

        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('contentSection').style.display = 'none';
        document.getElementById('videoContainer').style.display = 'none';
        
        showStatus('Logged out successfully', 'success');
        
        // Reload page to remove content protection
        setTimeout(() => location.reload(), 1000);
      } catch (error) {
        showStatus('Logout failed', 'error');
      }
    }

    // =====================================================
    // 5. SHOW STATUS MESSAGE
    // =====================================================
    function showStatus(message, type) {
      const statusCard = document.getElementById('statusCard');
      const statusMessage = document.getElementById('statusMessage');
      
      statusMessage.textContent = message;
      statusCard.style.display = 'block';
      statusCard.style.background = type === 'success' 
        ? 'rgba(34, 197, 94, 0.2)' 
        : 'rgba(239, 68, 68, 0.2)';
      
      setTimeout(() => {
        statusCard.style.display = 'none';
      }, 5000);
    }

    // =====================================================
    // 6. CHECK EXISTING SESSION ON PAGE LOAD
    // =====================================================
    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');

      if (token && user.email) {
        try {
          const response = await fetch(`${API_URL}/auth/session-status`, {
            headers: {
              'Authorization': `Bearer ${token}`
            },
            credentials: 'include'
          });

          const data = await response.json();

          if (data.success && data.isValid) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('contentSection').style.display = 'block';
            document.getElementById('userName').textContent = data.user.name;
            document.getElementById('userEmail').textContent = data.user.email;

            // Initialize content protection
            window.contentProtection = new ContentProtection(data.user.email);
          } else {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
          }
        } catch (error) {
          console.error('Session check failed:', error);
        }
      }
    });
  </script>

</body>
</html>
