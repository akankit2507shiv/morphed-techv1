<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python for Data Engineering - Morphex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#ff3d81',secondary:'#7c3cff',accent:'#00d4ff',dark:'#0b1020'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family:'Inter',sans-serif; 
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 61, 129, 0.5), transparent 35%),
        radial-gradient(circle at 82% 6%, rgba(0, 212, 255, 0.45), transparent 32%),
        radial-gradient(circle at 72% 82%, rgba(124, 60, 255, 0.48), transparent 38%),
        linear-gradient(135deg, #050816 0%, #0b1020 48%, #070812 100%);
      background-attachment: fixed;
      min-height:100vh; 
    }
    .gradient-text { 
      background:linear-gradient(135deg,#ff3d81,#7c3cff,#00d4ff); 
      -webkit-background-clip:text; 
      -webkit-text-fill-color:transparent; 
      background-clip:text; 
    }
    .card-hover { transition:all 0.3s ease; }
    .card-hover:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 20px 40px rgba(255,61,129,0.4); }
  </style>
</head>
<body class="text-white">

  <header class="bg-dark/50 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="student-dashboard.html" class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-lg flex items-center justify-center font-bold text-xl">M</div>
          <span class="text-2xl font-extrabold gradient-text">MORPHEX</span>
        </a>
        <div class="flex items-center gap-3">
          <button onclick="goBackToSyllabus()" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
            ← Back to Syllabus & Content
          </button>
          <a href="student-dashboard.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition">Dashboard</a>
        </div>
      </div>
      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm mt-3 text-gray-400">
        <a href="student-dashboard.html" class="hover:text-white transition">🏠 Dashboard</a>
        <span>/</span>
        <button onclick="goBackToSyllabus()" class="hover:text-white transition">📚 Syllabus & Content</button>
        <span>/</span>
        <span class="text-white font-medium">🐍 Python for Data Engineering</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <div class="flex items-center gap-4 mb-4">
        <span class="text-6xl">🐍</span>
        <div>
          <h1 class="text-4xl font-bold text-white mb-1">Python for Data Engineering</h1>
          <p class="text-gray-300">Master Python for data pipelines, ETL, and data processing</p>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm text-gray-400">
        <span id="topicCount">📚 0 Topics</span>
        <span>⏱️ ~10 hours</span>
        <span>🎯 Beginner → Advanced</span>
        <span id="progressLabel" class="text-accent font-semibold"></span>
      </div>
      <div class="bg-white/10 rounded-full h-2 mt-4 max-w-md">
        <div id="progressBar" class="h-2 rounded-full bg-gradient-to-r from-primary to-accent transition-all duration-500" style="width:0%"></div>
      </div>
    </div>

    <div id="topicsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script src="python-content.js"></script>
  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'student-login.html';

    const progress = JSON.parse(localStorage.getItem('userProgress') || '{}');

    const colors = [
      'from-yellow-400 via-yellow-500 to-orange-500',
      'from-green-400 via-green-500 to-teal-500',
      'from-blue-400 via-blue-500 to-cyan-500',
      'from-purple-400 via-purple-500 to-pink-500',
      'from-pink-400 via-pink-500 to-rose-500',
      'from-cyan-400 via-cyan-500 to-blue-500',
      'from-red-400 via-red-500 to-orange-500',
      'from-indigo-400 via-indigo-500 to-purple-500',
      'from-teal-400 via-teal-500 to-cyan-500',
      'from-orange-400 via-orange-500 to-red-500',
      'from-violet-400 via-violet-500 to-purple-500',
      'from-emerald-400 via-emerald-500 to-teal-500',
      'from-rose-400 via-rose-500 to-pink-500',
      'from-sky-400 via-sky-500 to-cyan-500',
      'from-fuchsia-400 via-fuchsia-500 to-pink-500',
    ];

    const diffColor = {
      Beginner: 'text-xs font-bold px-3 py-1 rounded-full',
      Intermediate: 'text-xs font-bold px-3 py-1 rounded-full',
      Advanced: 'text-xs font-bold px-3 py-1 rounded-full'
    };

    const diffStyle = {
      Beginner: 'background: linear-gradient(135deg, #b8ff3c, #00d4ff); color: #071018;',
      Intermediate: 'background: linear-gradient(135deg, #ffbf3c, #ff3d81); color: white;',
      Advanced: 'background: linear-gradient(135deg, #ff3d81, #7c3cff); color: white;'
    };

    function render() {
      const topicIds = Object.keys(pythonContent);
      const readyCount = topicIds.filter(id => pythonContent[id].ready !== false).length;
      const doneCount = topicIds.filter(id => progress[id]).length;

      document.getElementById('topicCount').textContent = `📚 ${topicIds.length} Topics`;
      document.getElementById('progressLabel').textContent = `${doneCount} / ${readyCount} completed`;
      document.getElementById('progressBar').style.width = readyCount ? Math.round((doneCount/readyCount)*100)+'%' : '0%';

      document.getElementById('topicsGrid').innerHTML = topicIds.map((id, i) => {
        const t = pythonContent[id];
        const isReady = t.ready !== false;
        const isDone = !!progress[id];
        const diff = t.difficulty || 'Beginner';

        if (isReady) {
          return `
            <div class="bg-white/5 backdrop-blur-xl border ${isDone ? 'border-green-400' : 'border-white/10'} rounded-2xl p-6 card-hover cursor-pointer relative overflow-hidden" onclick="openTopic('${id}')" style="background: rgba(18, 22, 37, 0.82);">
              ${isDone ? '<div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-br from-green-400/20 to-transparent rounded-bl-full"></div>' : ''}
              <div class="flex items-center justify-between mb-5">
                <div class="w-14 h-14 bg-gradient-to-br ${colors[i % colors.length]} rounded-xl flex items-center justify-center text-3xl shadow-lg">${t.icon || '🐍'}</div>
                <div class="flex flex-col items-end gap-2">
                  ${isDone ? '<span class="text-2xl">✅</span>' : ''}
                  <span class="${diffColor[diff] || diffColor.Beginner}" style="${diffStyle[diff] || diffStyle.Beginner}">${diff}</span>
                </div>
              </div>
              <div class="mb-4">
                <span class="text-xs font-bold px-2 py-1 rounded" style="background: rgba(255, 61, 129, 0.15); color: #ff3d81;">${t.category || 'Foundation'}</span>
              </div>
              <h3 class="text-lg font-bold text-white mb-2">${t.title}</h3>
              <p class="text-sm text-gray-400 mb-4 line-clamp-2">${t.subtitle || ''}</p>
              <div class="flex items-center justify-between text-xs">
                <span class="text-gray-400">⏱️ ${t.duration || '~45 min'}</span>
                <span class="text-gray-400">📝 ${t.quiz ? t.quiz.length : 10} Questions</span>
              </div>
            </div>`;
        } else {
          return `
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 opacity-50">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-gradient-to-br from-gray-500 to-gray-600 rounded-xl flex items-center justify-center text-2xl">${t.icon || '📝'}</div>
                <span class="text-xs px-3 py-1 bg-gray-500/20 text-gray-400 rounded-full">Coming Soon</span>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${t.title}</h3>
              <p class="text-sm text-gray-500">${t.subtitle || 'Coming soon...'}</p>
            </div>`;
        }
      }).join('');
    }

    function openTopic(id) {
      const hist = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      hist.unshift({ type:'python', title: pythonContent[id].title, url:`python-topic.html?topic=${id}`, time: new Date().toISOString() });
      localStorage.setItem('searchHistory', JSON.stringify(hist.slice(0,50)));

      if (user.role === 'admin') {
        window.location.href = `python-topic.html?topic=${id}`;
        return;
      }
      fetch(`${API}/enrollment/status`, { headers:{ Authorization:`Bearer ${token}` } })
        .then(r => r.json())
        .then(d => {
          if (!d.paid) { alert('🔒 Please complete payment to access content!'); window.location.href='student-dashboard.html'; }
          else if (d.enrollment && d.enrollment.content_access_granted === 0) { alert('🚫 Access denied. Contact admin.'); }
          else window.location.href = `python-topic.html?topic=${id}`;
        })
        .catch(() => { alert('Auth failed'); window.location.href='student-login.html'; });
    }

    render();

    function goBackToSyllabus() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'student-dashboard.html';
      }
    }
  </script>
</body>
</html>
