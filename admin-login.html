<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Morphed Tech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7C3AED',
            secondary: '#A78BFA',
            accent: '#06B6D4',
            dark: '#1E1B4B',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
    }
    
    /* Toggle Switch */
    .toggle { position: relative; display: inline-block; width: 50px; height: 26px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.1); border-radius: 26px; transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.2); }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    input:checked + .slider { background: linear-gradient(135deg, #7C3AED, #06B6D4); border-color: transparent; }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body class="text-white">

  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
      
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="text-5xl mb-4">🔐</div>
        <h1 class="text-4xl font-bold bg-gradient-to-r from-primary via-secondary to-accent bg-clip-text text-transparent">
          ADMIN PORTAL
        </h1>
        <p class="text-gray-400 mt-2">Morphed Tech Management</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl">
        
        <!-- Admin/Student Switch -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: rgba(255, 255, 255, 0.05); border-radius: 0.75rem;">
          <span style="font-size: 0.9rem; font-weight: 600; color: #9CA3AF;">Student Login</span>
          <label class="toggle" style="cursor: pointer;">
            <input type="checkbox" id="loginModeSwitch" checked onchange="toggleLoginMode()">
            <span class="slider"></span>
          </label>
          <span style="font-size: 0.9rem; font-weight: 600; color: #9CA3AF;">Admin Login</span>
        </div>
        
        <form id="adminLoginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Admin Email</label>
            <input type="email" id="adminEmail" placeholder="admin@morphedtech.com" required
              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-primary text-white placeholder-gray-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <input type="password" id="adminPassword" placeholder="Admin@123" required
              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-primary text-white placeholder-gray-500">
          </div>
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-primary to-accent text-white font-semibold rounded-lg hover:shadow-xl transition">
            Login as Admin
          </button>
        </form>

        <!-- Message -->
        <div id="message" class="mt-4 p-3 rounded-lg hidden"></div>

        <!-- Student Link (Hidden - use toggle instead) -->
        <div class="mt-6 text-center" style="display: none;">
          <a href="student-login.html" class="text-sm text-gray-400 hover:text-primary transition">
            ← Student Login
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';

    // Toggle between Student and Admin login
    function toggleLoginMode() {
      const isAdmin = document.getElementById('loginModeSwitch').checked;
      if (!isAdmin) {
        window.location.href = 'student-login.html';
      }
    }

    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `mt-4 p-3 rounded-lg ${type === 'success' ? 'bg-green-500/20 text-green-300 border border-green-500/50' : 'bg-red-500/20 text-red-300 border border-red-500/50'}`;
      messageDiv.classList.remove('hidden');
      setTimeout(() => messageDiv.classList.add('hidden'), 5000);
    }

    // Admin Login
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.user.role !== 'admin') {
            showMessage('Access denied. Admin credentials required.', 'error');
            return;
          }

          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
        } else {
          showMessage(data.error || 'Login failed', 'error');
        }
      } catch (error) {
        showMessage('Server error. Please try again.', 'error');
      }
    });

    // Check if already logged in as admin
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (localStorage.getItem('token') && user.role === 'admin') {
      window.location.href = 'admin-dashboard.html';
    }
    // Remove default credentials hint in production

  </script>

</body>
</html>
