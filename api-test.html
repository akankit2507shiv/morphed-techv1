<!DOCTYPE html>
<html>
<head>
    <title>API Test - Morphed Tech</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        #result { background: #2a2a2a; padding: 20px; margin-top: 20px; border-radius: 8px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <h1>🔧 API Connection Test</h1>
    <p>Testing connection to: <strong>https://kaal-morphed-tech.onrender.com/api</strong></p>
    
    <button onclick="testConnection()">Test API Connection</button>
    <button onclick="testAdminLogin()">Test Admin Login</button>
    
    <div id="result"></div>

    <script>
        const API_URL = 'https://kaal-morphed-tech.onrender.com/api';
        
        async function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Testing connection...</p>';
            
            try {
                const response = await fetch(`${API_URL}/landing/pricing`);
                const data = await response.json();
                
                result.innerHTML = `
                    <p class="success">✅ API Connection Successful!</p>
                    <p>Status: ${response.status}</p>
                    <p>Response: <pre>${JSON.stringify(data, null, 2)}</pre></p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ Connection Failed</p>
                    <p>Error: ${error.message}</p>
                    <p>Check browser console for details</p>
                `;
                console.error('Connection error:', error);
            }
        }
        
        async function testAdminLogin() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>Testing admin login endpoint...</p>';
            
            const email = prompt('Enter admin email:', 'admin@morphedtech.com');
            const password = prompt('Enter admin password:');
            
            if (!email || !password) {
                result.innerHTML = '<p class="error">❌ Cancelled</p>';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <p class="success">✅ Login Successful!</p>
                        <p>User: ${data.user.name}</p>
                        <p>Role: ${data.user.role}</p>
                        <p>Token: ${data.token.substring(0, 20)}...</p>
                    `;
                } else {
                    result.innerHTML = `
                        <p class="error">❌ Login Failed</p>
                        <p>Status: ${response.status}</p>
                        <p>Error: ${data.error || 'Unknown error'}</p>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ Request Failed</p>
                    <p>Error: ${error.message}</p>
                    <p>Check browser console for details</p>
                `;
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
