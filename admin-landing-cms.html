<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page CMS - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dopamine-ui.css">
  <style>
    .section-card {
      background: rgba(18, 22, 37, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }
    .section-card:hover {
      border-color: rgba(255, 61, 129, 0.5);
      box-shadow: 0 4px 20px rgba(255, 61, 129, 0.2);
    }
    .section-preview {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .btn-icon {
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: rgba(18, 22, 37, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div style="min-height: 100vh; padding: 2rem;">
    <div style="max-width: 1400px; margin: 0 auto;">
      
      <!-- Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
          <h1 class="gradient-text" style="font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem;">Landing Page CMS</h1>
          <p class="text-muted">Manage sections, pricing, and content on your landing page</p>
        </div>
        <div style="display: flex; gap: 1rem;">
          <a href="admin-dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
          <a href="index-landing.html" target="_blank" class="btn btn-primary">👁️ Preview Landing Page</a>
        </div>
      </div>

      <!-- Pricing Section -->
      <div class="panel" style="margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--cyan);">💰 Pricing Settings</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
          <div>
            <label class="label">Regular Price (₹)</label>
            <input type="number" id="regularPrice" class="input" value="11111">
          </div>
          <div>
            <label class="label">Launch Offer Price (₹)</label>
            <input type="number" id="offerPrice" class="input" value="7777">
          </div>
          <div>
            <label class="label">Offer Validity (Days)</label>
            <input type="number" id="offerDays" class="input" value="3">
          </div>
          <div>
            <label class="label">Limited Seats</label>
            <input type="number" id="limitedSeats" class="input" value="54">
          </div>
        </div>
        <button onclick="savePricing()" class="btn btn-primary" style="margin-top: 1rem;">💾 Save Pricing</button>
      </div>

      <!-- Sections Management -->
      <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--pink);">📄 Landing Page Sections</h2>
          <button onclick="openAddModal()" class="btn btn-primary">➕ Add New Section</button>
        </div>

        <div id="sectionsList">
          <!-- Sections will be loaded here -->
        </div>
      </div>

    </div>
  </div>

  <!-- Add/Edit Section Modal -->
  <div id="sectionModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 class="gradient-text" style="font-size: 1.8rem; font-weight: 800;" id="modalTitle">Add New Section</h2>
        <button onclick="closeModal()" class="btn-icon" style="font-size: 1.5rem;">✕</button>
      </div>

      <form id="sectionForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <input type="hidden" id="sectionId">
        
        <div>
          <label class="label">Section Name</label>
          <input type="text" id="sectionName" class="input" placeholder="e.g., Hero Section, Features, Testimonials" required>
        </div>

        <div>
          <label class="label">Section Type</label>
          <select id="sectionType" class="input" onchange="updateFormFields()">
            <option value="hero">Hero Section</option>
            <option value="features">Features Grid</option>
            <option value="pricing">Pricing Card</option>
            <option value="testimonials">Testimonials</option>
            <option value="faq">FAQ Section</option>
            <option value="cta">Call-to-Action</option>
            <option value="custom">Custom HTML</option>
          </select>
        </div>

        <div>
          <label class="label">Display Order</label>
          <input type="number" id="displayOrder" class="input" value="1" min="1">
          <small class="text-muted">Lower numbers appear first</small>
        </div>

        <div>
          <label class="label">Section Title</label>
          <input type="text" id="sectionTitle" class="input" placeholder="Main heading for this section">
        </div>

        <div>
          <label class="label">Section Subtitle</label>
          <textarea id="sectionSubtitle" class="input" rows="2" placeholder="Supporting text or description"></textarea>
        </div>

        <div id="dynamicFields">
          <!-- Dynamic fields based on section type -->
        </div>

        <div style="display: flex; gap: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="sectionVisible" checked>
            <span class="text-muted">Visible on landing page</span>
          </label>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">💾 Save Section</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let sections = [];
    let editingId = null;

    // Check authentication
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token || user.role !== 'admin') {
      window.location.href = 'admin-login.html';
    }

    // Load sections on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadSections();
      loadPricing();
    });

    // Load all sections
    async function loadSections() {
      try {
        const response = await fetch(`${API}/landing/sections`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        sections = await response.json();
        renderSections();
      } catch (error) {
        console.error('Error loading sections:', error);
        // Load from localStorage as fallback
        sections = JSON.parse(localStorage.getItem('landingSections') || '[]');
        renderSections();
      }
    }

    // Render sections list
    function renderSections() {
      const container = document.getElementById('sectionsList');
      
      if (sections.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📄</div>
            <p>No sections yet. Click "Add New Section" to get started.</p>
          </div>
        `;
        return;
      }

      sections.sort((a, b) => a.order - b.order);

      container.innerHTML = sections.map(section => `
        <div class="section-card">
          <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                <h3 style="font-size: 1.2rem; font-weight: 700; color: white;">${section.name}</h3>
                <span class="badge ${section.visible ? 'badge-success' : 'badge-warning'}">
                  ${section.visible ? '👁️ Visible' : '🚫 Hidden'}
                </span>
                <span class="badge badge-info">Order: ${section.order}</span>
                <span class="badge" style="background: rgba(124, 60, 255, 0.2); color: var(--violet);">${section.type}</span>
              </div>
              <p class="text-muted" style="font-size: 0.9rem;">${section.title || 'No title'}</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button onclick="moveSection(${section.id}, 'up')" class="btn-icon" title="Move Up">↑</button>
              <button onclick="moveSection(${section.id}, 'down')" class="btn-icon" title="Move Down">↓</button>
              <button onclick="editSection(${section.id})" class="btn-icon" title="Edit">✏️</button>
              <button onclick="toggleVisibility(${section.id})" class="btn-icon" title="Toggle Visibility">👁️</button>
              <button onclick="deleteSection(${section.id})" class="btn-icon" style="color: var(--pink);" title="Delete">🗑️</button>
            </div>
          </div>
          
          ${section.subtitle ? `<p class="text-muted" style="font-size: 0.85rem; margin-bottom: 0.5rem;">${section.subtitle}</p>` : ''}
          
          <div class="section-preview">
            <pre style="margin: 0; font-size: 0.75rem; color: var(--text-muted); white-space: pre-wrap;">${JSON.stringify(section.content, null, 2)}</pre>
          </div>
        </div>
      `).join('');
    }

    // Open add modal
    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add New Section';
      document.getElementById('sectionForm').reset();
      document.getElementById('sectionId').value = '';
      document.getElementById('sectionVisible').checked = true;
      updateFormFields();
      document.getElementById('sectionModal').classList.add('active');
    }

    // Edit section
    function editSection(id) {
      const section = sections.find(s => s.id === id);
      if (!section) return;

      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Section';
      document.getElementById('sectionId').value = section.id;
      document.getElementById('sectionName').value = section.name;
      document.getElementById('sectionType').value = section.type;
      document.getElementById('displayOrder').value = section.order;
      document.getElementById('sectionTitle').value = section.title || '';
      document.getElementById('sectionSubtitle').value = section.subtitle || '';
      document.getElementById('sectionVisible').checked = section.visible;
      
      updateFormFields();
      populateContentFields(section.content);
      
      document.getElementById('sectionModal').classList.add('active');
    }

    // Update form fields based on section type
    function updateFormFields() {
      const type = document.getElementById('sectionType').value;
      const container = document.getElementById('dynamicFields');
      
      let html = '';
      
      switch(type) {
        case 'hero':
          html = `
            <div>
              <label class="label">Hero Button Text</label>
              <input type="text" id="content_buttonText" class="input" placeholder="e.g., Start Learning Now">
            </div>
            <div>
              <label class="label">Hero Button Link</label>
              <input type="text" id="content_buttonLink" class="input" placeholder="e.g., student-login.html?tab=signup">
            </div>
          `;
          break;
        
        case 'features':
          html = `
            <div>
              <label class="label">Features (JSON Array)</label>
              <textarea id="content_features" class="input" rows="8" placeholder='[{"icon":"🚀","title":"Feature 1","description":"Description"}]'></textarea>
              <small class="text-muted">Enter features as JSON array</small>
            </div>
          `;
          break;
        
        case 'pricing':
          html = `
            <div>
              <label class="label">Features List (JSON Array)</label>
              <textarea id="content_features" class="input" rows="6" placeholder='["Feature 1","Feature 2","Feature 3"]'></textarea>
            </div>
          `;
          break;
        
        case 'testimonials':
          html = `
            <div>
              <label class="label">Testimonials (JSON Array)</label>
              <textarea id="content_testimonials" class="input" rows="8" placeholder='[{"name":"John","role":"Data Engineer","text":"Great course!","rating":5}]'></textarea>
            </div>
          `;
          break;
        
        case 'faq':
          html = `
            <div>
              <label class="label">FAQ Items (JSON Array)</label>
              <textarea id="content_faqs" class="input" rows="8" placeholder='[{"question":"Question?","answer":"Answer here"}]'></textarea>
            </div>
          `;
          break;
        
        case 'cta':
          html = `
            <div>
              <label class="label">CTA Button Text</label>
              <input type="text" id="content_buttonText" class="input" placeholder="e.g., Get Started Now">
            </div>
            <div>
              <label class="label">CTA Button Link</label>
              <input type="text" id="content_buttonLink" class="input" placeholder="e.g., student-login.html?tab=signup">
            </div>
          `;
          break;
        
        case 'custom':
          html = `
            <div>
              <label class="label">Custom HTML</label>
              <textarea id="content_html" class="input" rows="10" placeholder="Enter your custom HTML here"></textarea>
            </div>
          `;
          break;
      }
      
      container.innerHTML = html;
    }

    // Populate content fields when editing
    function populateContentFields(content) {
      if (!content) return;
      
      Object.keys(content).forEach(key => {
        const field = document.getElementById(`content_${key}`);
        if (field) {
          if (typeof content[key] === 'object') {
            field.value = JSON.stringify(content[key], null, 2);
          } else {
            field.value = content[key];
          }
        }
      });
    }

    // Save section
    document.getElementById('sectionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const type = document.getElementById('sectionType').value;
      const content = {};
      
      // Collect content fields
      document.querySelectorAll('[id^="content_"]').forEach(field => {
        const key = field.id.replace('content_', '');
        let value = field.value;
        
        // Try to parse JSON fields
        if (field.tagName === 'TEXTAREA' && value.trim().startsWith('[')) {
          try {
            value = JSON.parse(value);
          } catch (e) {
            console.warn('Could not parse JSON:', value);
          }
        }
        
        content[key] = value;
      });
      
      const section = {
        id: editingId || Date.now(),
        name: document.getElementById('sectionName').value,
        type: type,
        order: parseInt(document.getElementById('displayOrder').value),
        title: document.getElementById('sectionTitle').value,
        subtitle: document.getElementById('sectionSubtitle').value,
        visible: document.getElementById('sectionVisible').checked,
        content: content,
        updatedAt: new Date().toISOString()
      };
      
      if (editingId) {
        const index = sections.findIndex(s => s.id === editingId);
        sections[index] = section;
      } else {
        sections.push(section);
      }
      
      await saveSections();
      closeModal();
      showMessage('Section saved successfully!', 'success');
    });

    // Save sections to backend
    async function saveSections() {
      try {
        await fetch(`${API}/landing/sections`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(sections)
        });
      } catch (error) {
        console.error('Error saving to backend:', error);
      }
      
      // Always save to localStorage as backup
      localStorage.setItem('landingSections', JSON.stringify(sections));
      renderSections();
    }

    // Delete section
    async function deleteSection(id) {
      if (!confirm('Are you sure you want to delete this section?')) return;
      
      sections = sections.filter(s => s.id !== id);
      await saveSections();
      showMessage('Section deleted successfully!', 'success');
    }

    // Toggle visibility
    async function toggleVisibility(id) {
      const section = sections.find(s => s.id === id);
      if (section) {
        section.visible = !section.visible;
        await saveSections();
      }
    }

    // Move section
    async function moveSection(id, direction) {
      const index = sections.findIndex(s => s.id === id);
      if (index === -1) return;
      
      const newIndex = direction === 'up' ? index - 1 : index + 1;
      if (newIndex < 0 || newIndex >= sections.length) return;
      
      [sections[index], sections[newIndex]] = [sections[newIndex], sections[index]];
      
      // Update order numbers
      sections.forEach((s, i) => s.order = i + 1);
      
      await saveSections();
    }

    // Close modal
    function closeModal() {
      document.getElementById('sectionModal').classList.remove('active');
    }

    // Save pricing
    async function savePricing() {
      const pricing = {
        regularPrice: parseInt(document.getElementById('regularPrice').value),
        offerPrice: parseInt(document.getElementById('offerPrice').value),
        offerDays: parseInt(document.getElementById('offerDays').value),
        limitedSeats: parseInt(document.getElementById('limitedSeats').value)
      };
      
      try {
        await fetch(`${API}/landing/pricing`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(pricing)
        });
      } catch (error) {
        console.error('Error saving pricing:', error);
      }
      
      localStorage.setItem('landingPricing', JSON.stringify(pricing));
      showMessage('Pricing updated successfully!', 'success');
    }

    // Load pricing
    function loadPricing() {
      const pricing = JSON.parse(localStorage.getItem('landingPricing') || '{}');
      if (pricing.regularPrice) document.getElementById('regularPrice').value = pricing.regularPrice;
      if (pricing.offerPrice) document.getElementById('offerPrice').value = pricing.offerPrice;
      if (pricing.offerDays) document.getElementById('offerDays').value = pricing.offerDays;
      if (pricing.limitedSeats) document.getElementById('limitedSeats').value = pricing.limitedSeats;
    }

    // Show message
    function showMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `badge badge-${type}`;
      msg.textContent = text;
      msg.style.position = 'fixed';
      msg.style.top = '2rem';
      msg.style.right = '2rem';
      msg.style.zIndex = '9999';
      msg.style.padding = '1rem 1.5rem';
      msg.style.fontSize = '1rem';
      document.body.appendChild(msg);
      
      setTimeout(() => msg.remove(), 3000);
    }
  </script>
</body>
</html>
