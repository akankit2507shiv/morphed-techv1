<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Morphed Tech | Dopamine Pro UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* DOPAMINE PRO ADMIN UI */
    :root {
      --bg-1: #080912;
      --bg-2: #0b1020;
      --bg-3: #121827;
      --panel: rgba(18, 22, 37, 0.82);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #a7b0c3;
      --pink: #ff3d81;
      --violet: #7c3cff;
      --cyan: #00d4ff;
      --lime: #b8ff3c;
      --amber: #ffbf3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 61, 129, 0.5), transparent 35%),
        radial-gradient(circle at 82% 6%, rgba(0, 212, 255, 0.45), transparent 32%),
        radial-gradient(circle at 72% 82%, rgba(124, 60, 255, 0.48), transparent 38%),
        linear-gradient(135deg, #050816 0%, #0b1020 48%, #070812 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.6;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 48px 40px;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--pink), var(--violet), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradient-shift 4s ease infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .tab {
      flex: 1;
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, rgba(255, 61, 129, 0.3), rgba(124, 60, 255, 0.3));
      box-shadow: 0 4px 16px rgba(255, 61, 129, 0.3);
    }

    .tab:not(.active):hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .label {
      display: block;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
      outline: none;
    }

    .input::placeholder { color: var(--muted); }

    .input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--violet);
      box-shadow: 0 0 0 4px rgba(124, 60, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-primary {
      width: 100%;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--violet), var(--cyan));
      box-shadow: 0 4px 16px rgba(255, 61, 129, 0.4);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 61, 129, 0.5);
    }

    .btn-primary:hover::before { left: 100%; }

    .form-wrap { position: relative; min-height: 320px; }
    .form-panel { transition: all 0.4s cubic-bezier(0.4,0,0.2,1); }
    .form-panel.hidden-panel { opacity: 0; transform: translateX(30px); pointer-events: none; position: absolute; width: 100%; }
    .form-panel.active-panel { opacity: 1; transform: translateX(0); position: relative; }

    .logo-glow {
      filter: drop-shadow(0 0 30px rgba(255, 61, 129, 0.6));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(255, 61, 129, 0.6)); }
      50% { filter: drop-shadow(0 0 40px rgba(124, 60, 255, 0.8)); }
    }

    .badge-success {
      color: #071018;
      background: linear-gradient(135deg, var(--lime), var(--cyan));
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .badge-warning {
      color: #071018;
      background: var(--amber);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="max-width: 480px; width: 100%;">

      <!-- Logo Section -->
      <div style="text-align: center; margin-bottom: 48px;">
        <div class="logo-glow" style="display: inline-block; margin-bottom: 20px;">
          <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="72" height="72" rx="18" fill="url(#logo-gradient)"/>
            <path d="M22 50V22L36 32L50 22V50L36 40L22 50Z" fill="white"/>
            <defs>
              <linearGradient id="logo-gradient" x1="0" y1="0" x2="72" y2="72">
                <stop offset="0%" stop-color="#ff3d81"/>
                <stop offset="50%" stop-color="#7c3cff"/>
                <stop offset="100%" stop-color="#00d4ff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="gradient-text" style="font-size: 48px; font-weight: 900; margin-bottom: 12px; letter-spacing: -1.5px; line-height: 1;">MORPHED TECH</h1>
        <p style="color: var(--muted); font-size: 16px; font-weight: 600;">Data Engineering Mastery Platform</p>
      </div>

      <!-- Login Card -->
      <div class="panel">

        <!-- Tabs -->
        <div class="tabs">
          <button id="tabLogin" onclick="switchTab('login')" class="tab active">Sign In</button>
          <button id="tabSignup" onclick="switchTab('signup')" class="tab">Sign Up</button>
        </div>

        <!-- Form Container -->
        <div class="form-wrap">
          <!-- Login Form -->
          <div id="loginPanel" class="form-panel active-panel">
            <form id="loginForm" style="display: flex; flex-direction: column; gap: 20px;">
              <div>
                <label class="label">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="you@example.com" class="input">
              </div>
              <div>
                <label class="label">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="input">
              </div>
              <button type="submit" id="loginBtn" class="btn-primary" style="margin-top: 8px;">Sign In</button>
            </form>
          </div>

          <!-- Signup Form -->
          <div id="signupPanel" class="form-panel hidden-panel">
            <form id="signupForm" style="display: flex; flex-direction: column; gap: 20px;">
              <div>
                <label class="label">Full Name</label>
                <input type="text" id="signupName" required placeholder="Your full name" class="input">
              </div>
              <div>
                <label class="label">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="you@example.com" class="input">
              </div>
              <div>
                <label class="label">Phone Number</label>
                <input type="tel" id="signupPhone" required placeholder="+91 XXXXX XXXXX" class="input">
              </div>
              <div>
                <label class="label">Password</label>
                <input type="password" id="signupPassword" required placeholder="Minimum 6 characters" minlength="6" class="input">
              </div>
              <button type="submit" id="signupBtn" class="btn-primary" style="margin-top: 8px;">Create Account</button>
            </form>
          </div>
        </div>

        <!-- Message Box -->
        <div id="msg" style="display: none; margin-top: 24px;"></div>

        <!-- Admin Link -->
        <div style="margin-top: 32px; text-align: center; padding-top: 24px; border-top: 1px solid var(--border);">
          <a href="admin-login.html" style="color: var(--cyan); text-decoration: none; font-size: 14px; font-weight: 600;">Admin Portal →</a>
        </div>
      </div>

      <!-- Footer Text -->
      <div style="text-align: center; margin-top: 32px; color: var(--muted); font-size: 13px;">
        <p>Secure • Fast • Professional</p>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      const u = JSON.parse(localStorage.getItem('user') || '{}');
      window.location.href = u.role === 'admin' ? 'admin-dashboard.html' : 'student-dashboard.html';
    }

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabSignup').classList.toggle('active', !isLogin);
      document.getElementById('loginPanel').className = 'form-panel ' + (isLogin ? 'active-panel' : 'hidden-panel');
      document.getElementById('signupPanel').className = 'form-panel ' + (!isLogin ? 'active-panel' : 'hidden-panel');
      hideMsg();
    }

    function showMsg(text, isSuccess) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = isSuccess ? 'badge-success' : 'badge-warning';
      el.style.display = 'block';
    }

    function hideMsg() {
      document.getElementById('msg').style.display = 'none';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait...' : (btnId === 'loginBtn' ? 'Sign In' : 'Create Account');
      btn.style.opacity = loading ? '0.6' : '1';
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      setLoading('loginBtn', true);
      try {
        const r = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const d = await r.json();
        if (r.ok) {
          localStorage.setItem('token', d.token);
          localStorage.setItem('user', JSON.stringify(d.user));
          showMsg('✅ Login successful! Redirecting...', true);
          setTimeout(() => {
            window.location.href = d.user.role === 'admin' ? 'admin-dashboard.html' : 'student-dashboard.html';
          }, 800);
        } else {
          showMsg(d.error || 'Login failed', false);
          setLoading('loginBtn', false);
        }
      } catch {
        showMsg('Server error. Is the server running?', false);
        setLoading('loginBtn', false);
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      setLoading('signupBtn', true);
      try {
        const r = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('signupName').value,
            email: document.getElementById('signupEmail').value,
            phone: document.getElementById('signupPhone').value,
            password: document.getElementById('signupPassword').value
          })
        });
        const d = await r.json();
        if (r.ok) {
          localStorage.setItem('token', d.token);
          localStorage.setItem('user', JSON.stringify(d.user));
          showMsg('✅ Account created! Redirecting...', true);
          setTimeout(() => window.location.href = 'student-dashboard.html', 800);
        } else {
          showMsg(d.error || 'Registration failed', false);
          setLoading('signupBtn', false);
        }
      } catch {
        showMsg('Server error. Is the server running?', false);
        setLoading('signupBtn', false);
      }
    });
  </script>

</body>
</html>
