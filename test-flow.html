<!DOCTYPE html>
<html>
<head>
    <title>Quick Test - Register & Pay</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: Arial; 
            padding: 40px; 
            background: #1a1a1a; 
            color: white; 
            max-width: 800px;
            margin: 0 auto;
        }
        button { 
            padding: 15px 30px; 
            margin: 10px; 
            cursor: pointer; 
            background: linear-gradient(135deg, #7C3AED, #06B6D4);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        #result { 
            background: #2a2a2a; 
            padding: 20px; 
            margin-top: 20px; 
            border-radius: 8px; 
            border: 1px solid #444;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .step {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #7C3AED;
        }
    </style>
</head>
<body>
    <h1>🧪 Production Test - Complete Flow</h1>
    <p class="info">This will test the complete student registration and payment flow on production.</p>
    
    <div class="step">
        <h3>Step 1: Register Test Student</h3>
        <input type="text" id="name" placeholder="Full Name" value="Test Student">
        <input type="email" id="email" placeholder="Email" value="test@morphedtech.com">
        <input type="tel" id="phone" placeholder="Phone" value="9876543210">
        <input type="password" id="password" placeholder="Password" value="Test@123">
        <button onclick="registerStudent()">1️⃣ Register Student</button>
    </div>

    <div class="step">
        <h3>Step 2: Create Payment Enrollment</h3>
        <button onclick="createEnrollment()" id="enrollBtn" disabled>2️⃣ Create Enrollment (Login First)</button>
    </div>

    <div class="step">
        <h3>Step 3: Submit Transaction ID</h3>
        <input type="text" id="transactionId" placeholder="Transaction ID (12 digits)" value="TEST12345678">
        <button onclick="confirmPayment()" id="payBtn" disabled>3️⃣ Confirm Payment</button>
    </div>

    <div class="step">
        <h3>Step 4: Check Admin Dashboard</h3>
        <button onclick="window.open('admin-dashboard.html', '_blank')">4️⃣ Open Admin Dashboard</button>
    </div>

    <div id="result"></div>

    <script>
        const API_URL = 'https://kaal-morphed-tech.onrender.com/api';
        let token = '';
        let enrollmentId = '';
        
        function log(message, type = 'info') {
            const result = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            result.innerHTML += `<p class="${type}">[${timestamp}] ${message}</p>`;
            result.scrollTop = result.scrollHeight;
        }
        
        async function registerStudent() {
            log('🔄 Registering student...', 'info');
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.token;
                    log(`✅ Student registered successfully!`, 'success');
                    log(`📧 Email: ${email}`, 'info');
                    log(`🔑 Token: ${token.substring(0, 30)}...`, 'info');
                    document.getElementById('enrollBtn').disabled = false;
                } else {
                    log(`❌ Registration failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function createEnrollment() {
            log('🔄 Creating enrollment...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/enrollment/create`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ paymentMethod: 'UPI' })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    enrollmentId = data.enrollmentId;
                    log(`✅ Enrollment created!`, 'success');
                    log(`📝 Enrollment ID: ${enrollmentId}`, 'info');
                    log(`💰 Amount: ₹${data.amount}`, 'info');
                    log(`📱 UPI ID: ${data.upiId}`, 'info');
                    document.getElementById('payBtn').disabled = false;
                } else {
                    log(`❌ Enrollment failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function confirmPayment() {
            log('🔄 Confirming payment...', 'info');
            
            const transactionId = document.getElementById('transactionId').value;
            
            try {
                const response = await fetch(`${API_URL}/enrollment/confirm-payment`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ enrollmentId, transactionId })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Payment confirmed successfully!`, 'success');
                    log(`🎉 ${data.message}`, 'success');
                    log(``, 'info');
                    log(`🎯 NOW CHECK ADMIN DASHBOARD:`, 'success');
                    log(`   👥 Students tab should show 1 student`, 'info');
                    log(`   💳 Payments tab should show 1 payment (completed)`, 'info');
                } else {
                    log(`❌ Payment confirmation failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
