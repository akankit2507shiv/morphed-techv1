<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git & Version Control - Morphex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#ff3d81',secondary:'#7c3cff',accent:'#00d4ff',dark:'#0b1020'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:radial-gradient(circle at 8% 12%, rgba(255,61,129,0.15) 0%, transparent 35%),radial-gradient(circle at 82% 6%, rgba(0,212,255,0.12) 0%, transparent 30%),radial-gradient(circle at 72% 82%, rgba(124,60,255,0.13) 0%, transparent 40%),linear-gradient(180deg, #050816 0%, #0b1020 50%, #070812 100%); min-height:100vh; }
    .gradient-text { background:linear-gradient(135deg,#ff3d81,#7c3cff,#00d4ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .card-hover { transition:all 0.3s ease; }
    .card-hover:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 20px 40px rgba(255,61,129,0.4); }
  </style>
</head>
<body class="text-white">

  <header class="bg-dark/50 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="student-dashboard.html" class="flex items-center gap-3">
          <svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mpGradGit" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#7C3AED"/>
                <stop offset="100%" stop-color="#06B6D4"/>
              </linearGradient>
              <filter id="mpGlowGit" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <g filter="url(#mpGlowGit)">
              <path d="M20 90 L45 35 L70 65 L95 35 L120 90" stroke="url(#mpGradGit)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M70 65 L110 25" stroke="url(#mpGradGit)" stroke-width="6" stroke-linecap="round"/>
              <path d="M110 25 L98 28 M110 25 L106 37" stroke="url(#mpGradGit)" stroke-width="6" stroke-linecap="round"/>
            </g>
          </svg>
          <span class="text-2xl font-extrabold gradient-text">MORPHED TECH</span>
        </a>
        <div class="flex items-center gap-3">
          <a href="student-dashboard.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition">← Dashboard</a>
        </div>
      </div>
      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm mt-3 text-gray-400">
        <a href="student-dashboard.html" class="hover:text-white transition">🏠 Dashboard</a>
        <span>/</span>
        <span class="text-white font-medium">📚 Git & Version Control</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <div class="flex items-center gap-4 mb-4">
        <span class="text-6xl">📚</span>
        <div>
          <h1 class="text-4xl font-bold text-white mb-1">Git & Version Control</h1>
          <p class="text-gray-300">Master version control and collaboration with Git</p>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm text-gray-400">
        <span id="topicCount">📚 0 Topics</span>
        <span>⏱️ ~8 hours</span>
        <span>🎯 Beginner → Advanced</span>
        <span id="progressLabel" class="text-accent font-semibold"></span>
      </div>
      <div class="bg-white/10 rounded-full h-2 mt-4 max-w-md">
        <div id="progressBar" class="h-2 rounded-full bg-gradient-to-r from-primary to-accent transition-all duration-500" style="width:0%"></div>
      </div>
    </div>

    <div id="topicsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script src="git-content.js?v=3"></script>
  <script>
    const API = window.location.origin + '/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'student-login.html';

    // Check if gitContent is loaded
    if (typeof gitContent === 'undefined') {
      console.error('gitContent not loaded!');
      document.getElementById('topicsGrid').innerHTML = '<div class="col-span-3 text-center text-red-400 p-8">Error: Content not loaded. Please refresh the page.</div>';
    }

    const progress = JSON.parse(localStorage.getItem('userProgress') || '{}');

    const colors = [
      'from-pink-500 to-violet-600',
      'from-cyan-400 to-blue-500',
      'from-lime-400 to-green-500',
      'from-amber-400 to-orange-500',
      'from-violet-500 to-purple-600',
      'from-rose-400 to-pink-500',
      'from-teal-400 to-cyan-500',
      'from-yellow-400 to-amber-500',
      'from-fuchsia-500 to-pink-600',
      'from-sky-400 to-blue-500',
      'from-emerald-400 to-teal-500',
      'from-orange-400 to-red-500',
      'from-indigo-500 to-purple-600',
      'from-green-400 to-emerald-500',
    ];

    const diffColor = {
      Beginner: 'bg-gradient-to-r from-lime-400 to-cyan-400 text-gray-900 font-semibold',
      Intermediate: 'bg-gradient-to-r from-amber-400 to-pink-500 text-white font-semibold',
      Advanced: 'bg-gradient-to-r from-pink-500 to-violet-600 text-white font-semibold'
    };

    function render() {
      const topicIds = Object.keys(gitContent);
      const readyCount = topicIds.filter(id => gitContent[id].ready === true).length;
      const doneCount = topicIds.filter(id => progress[id]).length;

      document.getElementById('topicCount').textContent = `📚 ${topicIds.length} Topics`;
      document.getElementById('progressLabel').textContent = readyCount ? `${doneCount} / ${readyCount} completed` : 'Coming Soon';
      document.getElementById('progressBar').style.width = readyCount ? Math.round((doneCount/readyCount)*100)+'%' : '0%';

      document.getElementById('topicsGrid').innerHTML = topicIds.map((id, i) => {
        const t = gitContent[id];
        const isReady = t.ready === true;
        const isDone = !!progress[id];
        const diff = t.difficulty || 'Intermediate';

        if (isReady) {
          return `
            <div class="bg-white/5 backdrop-blur-xl border ${isDone ? 'border-green-500/40' : 'border-white/10'} rounded-2xl p-6 card-hover cursor-pointer" onclick="openTopic('${id}')">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-gradient-to-br ${colors[i % colors.length]} rounded-xl flex items-center justify-center text-2xl">${t.icon || '📚'}</div>
                <div class="flex items-center gap-2">
                  ${isDone ? '<span class="text-green-400 text-lg">✅</span>' : ''}
                  <span class="text-xs px-3 py-1 ${diffColor[diff] || diffColor.Intermediate} rounded-full">${diff}</span>
                </div>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${t.title}</h3>
              <p class="text-sm text-gray-400 mb-4">${t.subtitle || ''}</p>
              <div class="flex items-center justify-between text-xs text-gray-400">
                <span>⏱️ ${t.duration || '~60 min'}</span>
                <span>📝 ${t.quiz ? t.quiz.length : 9} Questions</span>
              </div>
            </div>`;
        } else {
          return `
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 opacity-50">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-gradient-to-br from-gray-500 to-gray-600 rounded-xl flex items-center justify-center text-2xl">${t.icon || '📚'}</div>
                <span class="text-xs px-3 py-1 bg-gray-500/20 text-gray-400 rounded-full">Coming Soon</span>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${t.title || 'Coming Soon'}</h3>
              <p class="text-sm text-gray-500">${t.subtitle || 'Topic being prepared...'}</p>
            </div>`;
        }
      }).join('');
    }

    function openTopic(id) {
      const hist = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      hist.unshift({ type:'git', title: gitContent[id].title, url:`git-topic.html?topic=${id}`, time: new Date().toISOString() });
      localStorage.setItem('searchHistory', JSON.stringify(hist.slice(0,50)));

      // Admin has full access
      if (user.role === 'admin') { 
        window.location.href = `git-topic.html?topic=${id}`; 
        return; 
      }
      
      // For students, check enrollment
      fetch(`${API}/enrollment/status`, { headers:{ Authorization:`Bearer ${token}` } })
        .then(r => r.json())
        .then(d => {
          if (!d.paid) { alert('🔒 Please complete payment to access content!'); window.location.href='student-dashboard.html'; }
          else if (d.enrollment && d.enrollment.content_access_granted === 0) { alert('🚫 Access denied. Contact admin.'); }
          else window.location.href = `git-topic.html?topic=${id}`;
        })
        .catch(() => { alert('Auth failed'); window.location.href='student-login.html'; });
    }

    render();
  </script>
</body>
</html>
