<!DOCTYPE html>
<html>
<head>
  <title>Force Reload</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
  <h1 class="text-3xl font-bold mb-6">🔄 Clear Cache & Reload</h1>
  
  <div class="space-y-4">
    <button onclick="clearAndReload()" class="px-6 py-3 bg-blue-500 rounded text-xl">
      Clear Cache & Go to Dashboard
    </button>
    
    <div class="bg-gray-800 p-4 rounded">
      <h2 class="text-xl mb-3">Manual Steps:</h2>
      <ol class="list-decimal list-inside space-y-2 text-gray-300">
        <li>Press <kbd class="bg-gray-700 px-2 py-1 rounded">Ctrl + Shift + Delete</kbd> (Windows) or <kbd class="bg-gray-700 px-2 py-1 rounded">Cmd + Shift + Delete</kbd> (Mac)</li>
        <li>Select "Cached images and files"</li>
        <li>Click "Clear data"</li>
        <li>Or just press <kbd class="bg-gray-700 px-2 py-1 rounded">Ctrl + F5</kbd> to hard refresh</li>
      </ol>
    </div>

    <div class="bg-green-800 p-4 rounded">
      <h2 class="text-xl mb-3">Current Cache Status:</h2>
      <pre id="cacheInfo" class="text-xs"></pre>
    </div>
  </div>

  <script>
    function clearAndReload() {
      // Clear localStorage
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      localStorage.clear();
      sessionStorage.clear();
      
      // Restore auth
      if (token) localStorage.setItem('token', token);
      if (user) localStorage.setItem('user', user);
      
      // Force reload with cache bypass
      window.location.href = 'student-dashboard.html?v=' + Date.now();
    }

    // Show cache info
    document.getElementById('cacheInfo').textContent = 
      'Token: ' + (localStorage.getItem('token') ? 'EXISTS' : 'MISSING') + '\n' +
      'User: ' + (localStorage.getItem('user') ? 'EXISTS' : 'MISSING') + '\n' +
      'Timestamp: ' + new Date().toISOString();
  </script>
</body>
</html>
