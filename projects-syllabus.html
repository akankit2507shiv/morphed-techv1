<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Projects - Morphex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#ff3d81',secondary:'#7c3cff',accent:'#00d4ff',dark:'#0b1020'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:radial-gradient(circle at 8% 12%, rgba(255,61,129,0.15) 0%, transparent 35%),radial-gradient(circle at 82% 6%, rgba(0,212,255,0.12) 0%, transparent 30%),radial-gradient(circle at 72% 82%, rgba(124,60,255,0.13) 0%, transparent 40%),linear-gradient(180deg, #050816 0%, #0b1020 50%, #070812 100%); min-height:100vh; }
    .gradient-text { background:linear-gradient(135deg,#ff3d81,#7c3cff,#00d4ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .card-hover { transition:all 0.3s ease; }
    .card-hover:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 20px 40px rgba(255,61,129,0.4); }
  </style>
</head>
<body class="text-white">

  <header class="bg-dark/50 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="student-dashboard.html" class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-lg flex items-center justify-center font-bold text-xl">M</div>
          <span class="text-2xl font-extrabold gradient-text">MORPHEX</span>
        </a>
        <div class="flex items-center gap-3">
          <button onclick="goBackToSyllabus()" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
            ← Back to Syllabus & Content
          </button>
          <a href="student-dashboard.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition">Dashboard</a>
        </div>
      </div>
      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm mt-3 text-gray-400">
        <a href="student-dashboard.html" class="hover:text-white transition">🏠 Dashboard</a>
        <span>/</span>
        <button onclick="goBackToSyllabus()" class="hover:text-white transition">📚 Syllabus & Content</button>
        <span>/</span>
        <span class="text-white font-medium">🏗️ Real Projects</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <div class="flex items-center gap-4 mb-4">
        <span class="text-6xl">🏗️</span>
        <div>
          <h1 class="text-4xl font-bold text-white mb-1">Real-World Data Engineering Projects</h1>
          <p class="text-gray-300">Build production-ready projects for your portfolio</p>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm text-gray-400">
        <span id="projectCount">📚 0 Projects</span>
        <span>⏱️ ~40 hours</span>
        <span>🎯 Beginner → Advanced</span>
        <span id="progressLabel" class="text-accent font-semibold"></span>
      </div>
      <div class="bg-white/10 rounded-full h-2 mt-4 max-w-md">
        <div id="progressBar" class="h-2 rounded-full bg-gradient-to-r from-primary to-accent transition-all duration-500" style="width:0%"></div>
      </div>
    </div>

    <div id="projectsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script src="projects-content.js"></script>
  <script>
    const API = 'https://kaal-morphed-tech.onrender.com/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'student-login.html';

    const progress = JSON.parse(localStorage.getItem('userProgress') || '{}');

    const colors = [
      'from-pink-500 to-violet-600',
      'from-cyan-400 to-blue-500',
      'from-lime-400 to-green-500',
      'from-amber-400 to-orange-500',
      'from-violet-500 to-purple-600',
      'from-rose-400 to-pink-500',
      'from-teal-400 to-cyan-500',
    ];

    const diffColor = {
      'Beginner': 'bg-gradient-to-r from-lime-400 to-cyan-400 text-gray-900 font-semibold',
      'Beginner to Intermediate': 'bg-gradient-to-r from-lime-400 to-cyan-400 text-gray-900 font-semibold',
      'Intermediate': 'bg-gradient-to-r from-amber-400 to-pink-500 text-white font-semibold',
      'Intermediate to Advanced': 'bg-gradient-to-r from-amber-400 to-pink-500 text-white font-semibold',
      'Advanced': 'bg-gradient-to-r from-pink-500 to-violet-600 text-white font-semibold',
      'Beginner to Advanced': 'bg-gradient-to-r from-amber-400 to-pink-500 text-white font-semibold'
    };

    function render() {
      const projectIds = Object.keys(projectsContent);
      const readyCount = projectIds.filter(id => projectsContent[id].ready === true).length;
      const doneCount = projectIds.filter(id => progress[id]).length;

      document.getElementById('projectCount').textContent = `📚 ${projectIds.length} Projects`;
      document.getElementById('progressLabel').textContent = readyCount ? `${doneCount} / ${readyCount} completed` : 'Coming Soon';
      document.getElementById('progressBar').style.width = readyCount ? Math.round((doneCount/readyCount)*100)+'%' : '0%';

      document.getElementById('projectsGrid').innerHTML = projectIds.map((id, i) => {
        const t = projectsContent[id];
        const isReady = t.ready === true;
        const isDone = !!progress[id];
        const diff = t.level || 'Intermediate';

        if (isReady) {
          return `
            <div class="bg-white/5 backdrop-blur-xl border ${isDone ? 'border-green-500/40' : 'border-white/10'} rounded-2xl p-6 card-hover cursor-pointer" onclick="openProject('${id}')">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-gradient-to-br ${colors[i % colors.length]} rounded-xl flex items-center justify-center text-2xl">${t.icon || '🏗️'}</div>
                <div class="flex items-center gap-2">
                  ${isDone ? '<span class="text-green-400 text-lg">✅</span>' : ''}
                  <span class="text-xs px-3 py-1 ${diffColor[diff] || diffColor.Intermediate} rounded-full">${diff}</span>
                </div>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${t.title}</h3>
              <p class="text-sm text-gray-400 mb-4">${t.subtitle || ''}</p>
              <div class="flex items-center justify-between text-xs text-gray-400">
                <span>⏱️ ${t.duration || '~5 hours'}</span>
                <span>🛠️ ${t.tech_stack ? t.tech_stack.length : 4} Tools</span>
              </div>
            </div>`;
        } else {
          return `
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 opacity-50">
              <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-gradient-to-br from-gray-500 to-gray-600 rounded-xl flex items-center justify-center text-2xl">${t.icon || '🏗️'}</div>
                <span class="text-xs px-3 py-1 bg-gray-500/20 text-gray-400 rounded-full">Coming Soon</span>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${t.title || 'Coming Soon'}</h3>
              <p class="text-sm text-gray-500">${t.subtitle || 'Project being prepared...'}</p>
            </div>`;
        }
      }).join('');
    }

    function openProject(id) {
      const hist = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      hist.unshift({ type:'projects', title: projectsContent[id].title, url:`project-detail.html?project=${id}`, time: new Date().toISOString() });
      localStorage.setItem('searchHistory', JSON.stringify(hist.slice(0,50)));

      if (user.role === 'admin') { window.location.href = `project-detail.html?project=${id}`; return; }
      fetch(`${API}/enrollment/status`, { headers:{ Authorization:`Bearer ${token}` } })
        .then(r => r.json())
        .then(d => {
          if (!d.paid) { alert('🔒 Please complete payment to access content!'); window.location.href='student-dashboard.html'; }
          else if (d.enrollment && d.enrollment.content_access_granted === 0) { alert('🚫 Access denied. Contact admin.'); }
          else window.location.href = `project-detail.html?project=${id}`;
        })
        .catch(() => { alert('Auth failed'); window.location.href='student-login.html'; });
    }

    render();

    function goBackToSyllabus() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'student-dashboard.html';
      }
    }
  </script>
</body>
</html>
