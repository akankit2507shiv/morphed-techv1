<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard Debug</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
    .test { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    button { padding: 10px 20px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #2563eb; }
    pre { background: #0a0a0a; padding: 10px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 Admin Dashboard Debug Test</h1>
  
  <div class="test">
    <h3>Step 1: Check Server</h3>
    <button onclick="testServer()">Test Server</button>
    <div id="serverResult"></div>
  </div>

  <div class="test">
    <h3>Step 2: Login as Admin</h3>
    <input type="email" id="email" value="admin@morphedtech.com" style="padding: 8px; width: 250px;">
    <input type="password" id="password" value="MorphedTech@2024!Secure" style="padding: 8px; width: 250px;">
    <button onclick="testLogin()">Login</button>
    <div id="loginResult"></div>
  </div>

  <div class="test">
    <h3>Step 3: Get Students (Need to login first)</h3>
    <button onclick="testGetStudents()">Get Students</button>
    <div id="studentsResult"></div>
  </div>

  <div class="test">
    <h3>Step 4: Get Stats</h3>
    <button onclick="testGetStats()">Get Stats</button>
    <div id="statsResult"></div>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let token = localStorage.getItem('token');

    async function testServer() {
      const result = document.getElementById('serverResult');
      result.innerHTML = '<p>Testing...</p>';
      
      try {
        const response = await fetch(API + '/auth/me');
        result.innerHTML = `<p class="success">✅ Server is responding!</p><p>Status: ${response.status}</p>`;
      } catch(e) {
        result.innerHTML = `<p class="error">❌ Server error: ${e.message}</p>`;
      }
    }

    async function testLogin() {
      const result = document.getElementById('loginResult');
      result.innerHTML = '<p>Logging in...</p>';
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          token = data.token;
          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(data.user));
          result.innerHTML = `
            <p class="success">✅ Login successful!</p>
            <p>Role: ${data.user.role}</p>
            <p>Token: ${token.substring(0, 50)}...</p>
          `;
        } else {
          result.innerHTML = `<p class="error">❌ Login failed: ${data.error}</p>`;
        }
      } catch(e) {
        result.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
      }
    }

    async function testGetStudents() {
      const result = document.getElementById('studentsResult');
      result.innerHTML = '<p>Loading students...</p>';
      
      if (!token) {
        result.innerHTML = '<p class="error">❌ Please login first!</p>';
        return;
      }
      
      try {
        const response = await fetch(API + '/admin/students', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          result.innerHTML = `
            <p class="success">✅ Got ${data.length} students!</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
        }
      } catch(e) {
        result.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
      }
    }

    async function testGetStats() {
      const result = document.getElementById('statsResult');
      result.innerHTML = '<p>Loading stats...</p>';
      
      if (!token) {
        result.innerHTML = '<p class="error">❌ Please login first!</p>';
        return;
      }
      
      try {
        const response = await fetch(API + '/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          result.innerHTML = `
            <p class="success">✅ Stats loaded!</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          result.innerHTML = `<p class="error">❌ Failed: ${data.error}</p>`;
        }
      } catch(e) {
        result.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
      }
    }

    // Auto-test on load
    window.onload = () => {
      testServer();
      if (token) {
        document.getElementById('loginResult').innerHTML = '<p class="success">✅ Already logged in (token found)</p>';
      }
    };
  </script>
</body>
</html>
